#           plugin_licenses: yes
#           plugin_licenses_setup: bash -c '[[ -f package.json ]] && npm ci || true'
#           plugin_licenses_legal: no
#           plugin_licenses_ratio: yes
          
      # 💡 Coding habits and activity
      # Disabled because the upstream plugin expects event payload fields that
      # GitHub no longer returns from the user events API.
          
#       # 🏅 Repository contributors
#       - name: Contributors with contributions count
#         uses: lowlighter/metrics@latest
#         with:
#           filename: github-metrics/contributors.contributions.svg
#           token: ${{ github.token }}
#           base: ""
#           template: repository
#           repo: metrics
#           plugin_contributors: yes
#           plugin_contributors_contributions: yes
          
      # 🎟️ Follow-up of issues and pull requests 
      - name: Indepth analysis
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/followup.indepth.svg
          token: ${{ github.token }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes
          
      # 🎭 Comment reactions
      - name: Comment reactions
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/reactions.svg
          token: ${{ github.token }}
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage

      # 🧑‍🤝‍🧑 People    
      - name: Followers
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/people.followers.svg
          token: ${{ github.token }}
          base: ""
          plugin_people: yes
          plugin_people_limit: 500
          plugin_people_size: 36
          plugin_people_types: followers, following
       
#       # 💕 GitHub Sponsors
#       - name: Sponsors goal
#         uses: lowlighter/metrics@latest
#         with:
#           filename: github-metrics/sponsors.svg
#           token: ${{ github.token }}
#           base: ""
#           plugin_sponsors: yes
#           plugin_sponsors_sections: goal, list
#           plugin_sponsors_past: yes
          
      # 📓 Featured repositories
      - name: Pinned repositories
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/repositories.pinned.svg
          token: ${{ github.token }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 2

      # 💬 Discussions
      - name: GitHub Discussions
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/discussions.svg
          token: ${{ github.token }}
          base: ""
          plugin_discussions: yes
          plugin_discussions_categories_limit: 8       
   
      # 📆 Commit calendar
      - name: Full history calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/calendar.full.svg
          token: ${{ github.token }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0

      # 🏆 Achievements
      - name: Compact display
        # Pinned to a maintained fork containing the Projects V2 migration and
        # a current Docker build, including xz-utils for licensed/nokogiri and
        # a modern Chrome keyring (the upstream PR still uses the old image).
        uses: lexicalunit/metrics@1bc4e0f44c4a00ab40e6776e9c7b3271a5ba59a4
        with:
          filename: github-metrics/achievements.compact.svg
          # Achievements queries user-level GraphQL data and needs a PAT.
          token: ${{ secrets.GH_TOKEN }}
          # Keep repository writes scoped to the workflow token.
          committer_token: ${{ github.token }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_only: >-
            polyglot, stargazer, sponsor, deployer, member, maintainer, developer,
            scripter, packager, explorer, infographile, manager
          plugin_achievements_display: compact
          plugin_achievements_threshold: X

      # 🎩 Notable contributions
      - name: Notable contributions
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/notable.svg
          # Notable contributions query user-level data and need a PAT.
          token: ${{ secrets.GH_TOKEN }}
          # Keep repository writes scoped to the workflow token.
          committer_token: ${{ github.token }}
          base: ""
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit,pull_request,issue
          plugin_notable_repositories: yes
          plugin_notable_self: no

      # 📰 Recent activity
      # Disabled because the upstream plugin parses legacy event payloads
      # before applying its event filter.
   
